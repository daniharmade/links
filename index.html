<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dani Harmade | Links</title>
  <meta name="description" content="All the places to find Dani Harmade: portfolio, CV, research profiles, and social links.">
  <meta name="theme-color" content="#0F172A">
  <link rel="canonical" href="https://daniharmade.vercel.app/links">

  <meta property="og:title" content="Dani Harmade | Links">
  <meta property="og:description" content="All the places to find Dani Harmade: portfolio, CV, research profiles, and social links.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://daniharmade.vercel.app/links">
  <meta property="og:image" content="https://daniharmade.vercel.app/links/src/img/logo.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="src/img/favicon.ico" sizes="any">
  <link rel="manifest" href="site.webmanifest">

  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      try {
        var t = localStorage.theme;
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) d.classList.add('dark');
      } catch (e) {
        if (matchMedia('(prefers-color-scheme: dark)').matches) d.classList.add('dark');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="src/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="src/css/style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Dani Harmade",
    "url": "https://daniharmade.vercel.app/",
    "email": "mailto:daniharmade@gmail.com",
    "jobTitle": "Quality Assurance Engineer",
    "sameAs": [
      "https://www.linkedin.com/in/daniharmade/",
      "https://github.com/daniharmade",
      "https://www.dicoding.com/users/dani_harmade/academies",
      "https://scholar.google.com/citations?user=TYSZfHQAAAAJ&hl=id",
      "https://www.researchgate.net/profile/Dani-Harmade",
      "https://orcid.org/0009-0009-1044-4653",
      "https://www.youtube.com/channel/UC6k1jD6eKMEUN5sD4ICTrzw",
      "https://www.instagram.com/daniharmade/",
      "https://www.facebook.com/daniharmade"
    ]
  }
  </script>
</head>
<body class="min-h-screen bg-[#F8FAFC] font-sans text-slate-600 antialiased">
  <a href="#main-content" class="skip-link">Skip to content</a>

  <header id="site-header" class="fixed inset-x-0 top-0 z-40 h-16 border-b border-slate-200 bg-white/90 backdrop-blur-md">
    <div class="mx-auto flex h-full max-w-md items-center justify-between px-4">
      <a href="#" aria-label="Dani Harmade, back to top" class="flex items-center">
        <img src="src/img/logo.png" alt="Dani Harmade" width="120" height="32" class="h-8 w-auto dark:hidden">
        <img src="src/img/logo-white.png" alt="" aria-hidden="true" width="120" height="32" class="hidden h-8 w-auto dark:block">
      </a>
      <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch theme"
        class="flex h-9 w-9 items-center justify-center rounded-lg border border-slate-200 text-slate-600 transition hover:bg-slate-50"></button>
    </div>
    <div id="progress" class="absolute bottom-0 left-0 h-0.5 w-0 bg-slate-900" aria-hidden="true"></div>
  </header>

  <main id="main-content" class="mx-auto max-w-md px-4 pb-16 pt-28">
    <section class="flex flex-col items-center text-center" aria-label="Profile">
      <button id="avatar-btn" type="button" aria-label="View profile photo full size" class="rounded-full">
        <img src="src/img/avatar.webp" alt="Dani Harmade" width="128" height="128"
          class="h-32 w-32 rounded-full border-4 border-white object-cover shadow-sm transition duration-200 hover:scale-105">
      </button>
      <p id="open-to-work" class="mt-4 inline-flex items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-medium text-slate-600">
        <span class="relative flex h-2 w-2">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-green-500 opacity-75"></span>
          <span class="relative inline-flex h-2 w-2 rounded-full bg-green-500"></span>
        </span>
        Open to work
      </p>
      <h1 id="profile-name" class="mt-4 text-xl font-bold tracking-tight text-slate-900"></h1>
      <p id="profile-role" class="mt-1 text-sm font-medium text-slate-600"></p>
      <p id="profile-tagline" class="mt-2 text-sm text-slate-500"></p>
      <div id="stack" class="mt-4 flex flex-wrap justify-center gap-2" aria-label="Tech stack"></div>
    </section>

    <div id="socials" class="mt-6 flex justify-center gap-3" aria-label="Social profiles"></div>

    <div id="links" class="mt-8"></div>

    <a id="portfolio-cta" href="#" target="_blank" rel="noopener noreferrer"
      class="btn-primary mt-8 flex w-full items-center justify-center gap-2 rounded-lg bg-slate-900 px-4 py-3 text-sm font-semibold text-white transition hover:bg-slate-800">
      Visit portfolio <i class="fa-solid fa-arrow-right text-xs" aria-hidden="true"></i>
    </a>
  </main>

  <footer class="border-t border-slate-100 py-6 text-center text-xs text-slate-500">
    <p>&copy; <span id="year"></span> Dani Harmade</p>
    <p class="mt-1">Last updated: <span id="updated"></span></p>
  </footer>

  <div id="toast" role="status" aria-live="polite" class="fixed bottom-4 right-4 z-50 rounded-lg bg-slate-900 px-4 py-3 text-sm text-white shadow-lg"></div>

  <div id="photo-dialog" data-dialog hidden role="dialog" aria-modal="true" aria-label="Profile photo"
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 p-4 backdrop-blur-sm">
    <div class="relative">
      <button type="button" data-close-btn aria-label="Close photo" class="absolute -top-11 right-0 flex h-9 w-9 items-center justify-center rounded-lg text-xl text-white hover:bg-white/10">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
      <img src="src/img/avatar-full.jpg" alt="Dani Harmade, full-size photo" loading="lazy" class="max-h-[88vh] max-w-full rounded-xl object-contain">
    </div>
  </div>

  <div id="qris-dialog" data-dialog hidden role="dialog" aria-modal="true" aria-label="Support via QRIS"
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 p-4 backdrop-blur-sm">
    <div class="relative max-h-[92vh] w-full max-w-sm overflow-y-auto rounded-xl border border-slate-200 bg-white p-6 text-center shadow-sm">
      <button type="button" data-close-btn aria-label="Close QRIS" class="absolute right-3 top-3 flex h-9 w-9 items-center justify-center rounded-lg text-slate-500 hover:bg-slate-50">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
      <h2 class="text-base font-semibold text-slate-900">Support via QRIS</h2>
      <p class="mt-1 text-xs text-slate-500">Scan using any e-wallet</p>
      <img src="src/img/qris.png" alt="QRIS code" loading="lazy" class="mx-auto mt-4 max-h-[60vh] w-auto rounded-lg border border-slate-200">
    </div>
  </div>

  <script type="module" src="src/js/index.js"></script>
</body>
</html>
